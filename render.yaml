services:
  - type: web
    name: legacy-modern-platform
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: legacy-modern-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AI_API_KEY
        sync: false

databases:
  - name: legacy-modern-db
    plan: free
    databaseName: legacymodern
    user: legacymodern_user
